<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00552e">
<title>Tabela do Verdão</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<style>
@font-face{font-family:"Archivo Black";src:url(fontes/archivo-black.woff) format("woff");font-display:swap}
@font-face{font-family:Montserrat;src:url(fontes/montserrat.woff) format("woff");font-weight:100 900;font-display:swap}
/* VOICE: álbum de figurinhas de pai e filho, alegre e cheio de energia
   IDEA: cada jogo é uma figurinha colada na página verde do álbum; conquistas são espaços para colar
   PICTURE: a figurinha grande do próximo jogo, com os dois escudos enormes e os palpites dos dois
   COLOUR and TYPE: verde Palmeiras com bolinhas, figurinhas brancas, dourado de taça e coral; Archivo Black + Montserrat, guardadas no próprio aplicativo
   LAYOUT: uma coluna de celular, barra de abas fixa embaixo, grades de figurinhas em duas colunas */
:root{--disp:"Archivo Black","Arial Black",Impact,sans-serif;--g:#00753f;--g2:#00552e;--g3:#003a20;--gold:#ffc62b;--gold2:#e0a400;--coral:#ff5d4e;--sky:#2fa8ff;
--paper:#fff;--ink:#0d2a1b;--soft:#5d7368;--line:#e3ebe6;--pai:#ffc62b;--filho:#ff7a5c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--g2)}
body{margin:0;color:var(--ink);font:600 16px/1.45 Montserrat,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
 background:var(--g2) radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px) 0 0/22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.d{font-family:var(--disp);font-weight:400;letter-spacing:.3px}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;color:#fff}
.top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
.logo{flex:1;display:flex;align-items:center;gap:10px}
.logo img{width:40px;height:40px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo b{font:400 19px/1.05 var(--disp);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.who{display:flex;gap:6px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 20px/1 var(--disp);color:#3a2300;border:3px solid transparent;flex:none}
.who button{border:0;background:none;padding:0;opacity:.55;transition:transform .15s}
.who button.on{opacity:1;transform:scale(1.08)}
.who button.on .av{border-color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.gear{border:0;background:rgba(0,0,0,.2);color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
main{max-width:720px;margin:0 auto;padding:8px 14px calc(110px + env(safe-area-inset-bottom))}
/* figurinha */
.fig{background:var(--paper);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 14px 30px rgba(0,0,0,.18);position:relative}
.hero{padding:30px 16px 16px;margin-top:22px;transform:rotate(-.6deg)}
.fita{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(.6deg);background:var(--gold);color:#3a2300;font:400 15px/1 var(--disp);text-transform:uppercase;padding:9px 18px 8px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 0 var(--gold2)}
.fita.live{background:var(--coral);color:#fff;box-shadow:0 3px 0 #c63d31;animation:pisca 1.2s infinite}
@keyframes pisca{50%{filter:brightness(1.2)}}
.comp{text-align:center;color:var(--soft);font-size:14px;font-weight:800}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin:10px 0 6px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:900;font-size:15px;line-height:1.15}
.crest{width:96px;height:96px;display:grid;place-items:center;flex:none;border-radius:50%;font:400 30px var(--disp)}
.crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.crest.has{border-radius:0;background:none!important}
.crest.m{width:58px;height:58px;font-size:20px}.crest.s{width:40px;height:40px;font-size:15px}.crest.xs{width:24px;height:24px;font-size:10px}
.placar{font:400 48px/1 var(--disp);color:var(--ink);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.placar i{font-style:normal;font-size:28px;color:var(--soft)}
.placar .q{color:#c9d6cf}
.info{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{background:#eef5f1;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--g2);white-space:nowrap}
.pill.hot{background:#fff1d1;color:#8a5a00}
.palps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.palp{background:#f5f9f7;border-radius:16px;padding:8px;display:flex;align-items:center;gap:8px;border:2px dashed #cfe0d6}
.palp.ok{border-style:solid;border-color:transparent;background:#eaf6ef}
.palp .av{width:34px;height:34px;font-size:16px;border:0}
.palp b{font:400 22px/1 var(--disp)}.palp small{display:block;font-size:12px;color:var(--soft);line-height:1.15}
.cta{width:100%;border:0;border-radius:16px;background:var(--gold);color:#3a2300;font:400 18px/1 var(--disp);padding:15px;min-height:54px;margin-top:12px;box-shadow:0 4px 0 var(--gold2)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.cta.g{background:var(--g);color:#fff;box-shadow:0 4px 0 var(--g3)}
/* seções */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px;color:#fff}
.sec h2{margin:0;font:400 21px/1.1 var(--disp);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.sec button,.sec span{border:0;background:none;color:var(--gold);font-weight:800;font-size:14px}
.duelo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px;gap:8px}
.duelo .lado{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900}
.duelo .n{font:400 42px/1 var(--disp)}
.duelo .meio{font:400 15px/1.1 var(--disp);color:var(--soft);text-align:center}
.coroa{font:400 12px/1 var(--disp);background:var(--gold);color:#3a2300;border-radius:999px;padding:4px 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid{align-items:stretch}.grid>.card{height:auto;align-self:stretch}
.card{border:0;padding:14px 10px 12px;justify-content:flex-start;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.card:nth-child(odd){transform:rotate(-.8deg)}.card:nth-child(even){transform:rotate(.7deg)}
.card .vs2{font-weight:900;font-size:14px;line-height:1.15}
.card .sc{font:400 26px/1 var(--disp);font-variant-numeric:tabular-nums}
.card .dt{font-size:12px;color:var(--soft);font-weight:700;line-height:1.2}
.selo{position:absolute;top:8px;right:6px;font:400 10px/1 var(--disp);letter-spacing:.5px;padding:5px 7px;border-radius:8px;color:#fff;transform:rotate(8deg)}
.selo.V{background:var(--g)}.selo.E{background:var(--gold2)}.selo.D{background:var(--coral)}
.falta{font-size:12px;font-weight:900;color:var(--coral)}
.pts{font-size:12px;font-weight:900;color:var(--g)}
.rolo{display:flex;gap:12px;overflow-x:auto;margin:0 -14px;padding:4px 14px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rolo .card{flex:0 0 46%;scroll-snap-align:start;max-width:200px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -14px 0;padding:0 14px 4px;scrollbar-width:none}
.chips button{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 16px;min-height:42px;font-weight:800;font-size:14px}
.chips button.on{background:var(--gold);color:#3a2300}
.vazio{padding:20px;text-align:center;color:var(--soft);font-weight:700}
.note{font-size:14px;color:#cfe6d8;font-weight:700;margin:8px 2px}
/* conquistas */
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{border-radius:18px;padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot.off{border:3px dashed rgba(255,255,255,.35);color:#cfe6d8}
.slot.on{background:linear-gradient(135deg,#fff6d6,#ffd75e 45%,#fff3c4 55%,#ffc62b);box-shadow:0 4px 0 var(--gold2);color:#3a2300;transform:rotate(-1.5deg)}
.slot svg{width:40px;height:40px}
.slot b{font:400 13px/1.1 var(--disp)}.slot span{font-size:11px;line-height:1.2;font-weight:800;opacity:.85}
.seg2{display:flex;gap:6px;background:rgba(0,0,0,.18);border-radius:999px;padding:4px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;color:#fff;border-radius:999px;padding:8px;font-weight:900;min-height:42px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg2 button.on{background:#fff;color:var(--ink)}
.seg2 .av{width:26px;height:26px;font-size:13px;border:0}
.lista .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.lista .row:first-child{border-top:0}
.lista .row .tx{flex:1;font-size:14px;line-height:1.3}
.lista .row .tx b{font-size:15px}
.mini{display:block;font-size:13px;color:var(--soft);font-weight:700}
/* tabela */
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-weight:700}
.tbl th{font:400 13px var(--disp);color:var(--soft);padding:12px 4px 8px;text-align:right;letter-spacing:.5px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl td:first-child,.tbl th:first-child{text-align:center;width:34px}
.tbl tr.pal td{background:#fff3c4}
.tbl tr{cursor:pointer}
.tbl .p{font:400 17px var(--disp)}
.tbl .pos{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#eef5f1;font:400 13px var(--disp)}
.tbl tr:nth-child(-n+4) .pos{background:var(--g);color:#fff}
.tbl tr:nth-last-child(-n+4) .pos{background:#ffe1dd;color:#b3271b}
.tnome{display:inline-flex;align-items:center;gap:8px}
/* craques */
.craque{padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.craque .foto{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font:400 26px var(--disp);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.craque.top{background:linear-gradient(135deg,#fff6d6,#ffd75e 45%,#fff3c4 55%,#ffc62b)}
.craque.top .foto{background:var(--g3)}
.craque b{font-weight:900;line-height:1.15}
.craque .n{font:400 34px/1 var(--disp)}
.craque small{font-size:12px;font-weight:800;color:var(--soft)}
.cart{display:inline-block;width:16px;height:22px;border-radius:3px;vertical-align:middle;margin-left:4px}
/* navegação */
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:center;pointer-events:none}
.nav>div{display:flex;max-width:520px;width:100%;background:#fff;border-radius:24px;padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.25);pointer-events:auto}
.navb{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;color:#7b9186;min-height:56px;border-radius:18px}
.navb svg{width:24px;height:24px}
.navb span{font-size:12px;font-weight:900}
.navb.on{background:var(--g);color:#fff}
.fab{position:fixed;right:18px;bottom:calc(98px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--gold);color:#3a2300;font:400 34px/1 var(--disp);box-shadow:0 4px 0 var(--gold2),0 10px 20px rgba(0,0,0,.25);z-index:4}
/* janelas */
.sheet{position:fixed;inset:0;background:rgba(0,30,15,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.panel{background:#f3f8f5;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:#f3f8f5;padding:8px 0;z-index:2}
.ph h2{margin:0;font:400 19px/1.15 var(--disp)}
.x2{border:0;background:#e2ece6;border-radius:50%;width:44px;height:44px;font-size:20px;font-weight:900;flex:none}
.seg{display:flex;gap:4px;background:#e2ece6;border-radius:16px;padding:4px;margin:6px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:8px 4px;font-weight:900;font-size:14px;white-space:nowrap;min-height:42px;color:var(--soft)}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 2px 0 rgba(0,0,0,.08)}
label{display:block;font-size:14px;font-weight:800;color:var(--soft);margin:12px 0 4px}
input,select,textarea{width:100%;font-size:16px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:46px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;gap:6px 4px;background:#fff;border-radius:20px;padding:12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.step>b{grid-column:1/-1;display:block;text-align:center;font-size:13px;color:var(--soft);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step button{width:46px;height:46px;border-radius:50%;border:0;background:#e2ece6;font:400 26px/1 var(--disp);flex:none}
.step button.mais{background:var(--g);color:#fff}
.step .n{font:400 44px/1 var(--disp);text-align:center}
.item{background:#fff;border-radius:16px;padding:10px;margin-bottom:8px}
.item .g3{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:8px;align-items:center}
.x{border:0;background:none;color:var(--coral);font-size:22px;width:44px;height:44px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:900;color:var(--ink);background:#fff;border-radius:16px;padding:12px}
.toggle input{width:26px;height:26px;min-height:0;accent-color:var(--g)}
.btn2{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;min-height:46px;font-weight:900;width:100%}
.danger{color:var(--coral);border-color:#ffd0ca;margin-top:12px}
.pnote{font-size:14px;color:var(--soft);font-weight:700}
.aviso{min-height:20px}
.row2{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-weight:800}
/* comemoração */
.gol{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:radial-gradient(circle,var(--g),var(--g3));pointer-events:none}
.gol.on{display:grid}
.gol b{display:block;font:400 clamp(56px,19vw,140px)/1 var(--disp);color:var(--gold);text-shadow:0 6px 0 var(--gold2),0 14px 30px rgba(0,0,0,.35)}
.gol span{display:block;text-align:center;color:#fff;font:400 18px var(--disp);margin-top:10px}
.gol canvas{position:absolute;inset:0;width:100%;height:100%}
.login{max-width:420px;margin:30px auto 0;padding:22px 18px}
@media(prefers-reduced-motion:no-preference){
 .sheet.open .panel{animation:up .25s cubic-bezier(.2,1.2,.4,1)}@keyframes up{from{transform:translateY(60px)}}
 .gol.on b{animation:pulo .6s cubic-bezier(.2,1.6,.4,1) both}@keyframes pulo{from{transform:scale(.2) rotate(-12deg)}}
 .hero{animation:cola .5s cubic-bezier(.2,1.4,.4,1) both}@keyframes cola{from{transform:rotate(-6deg) scale(.92);opacity:0}}}
@media(max-width:370px){.crest{width:76px;height:76px}.placar{font-size:46px}.logo b{font-size:20px}.av{width:40px;height:40px}}
</style>
</head>
<body>
<header><div class="top"><div class="logo"><img src="icones/icone-192.png" alt=""><b>Tabela do<br>Verdão</b></div><div class="who" id="who"></div>
<button class="gear" data-config="1" aria-label="Ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button></div></header>
<main id="view"><div class="fig hero"><div class="vazio">Abrindo o álbum…</div></div></main>
<nav class="nav"><div id="nav"></div></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="gol" id="gol"><canvas id="confete"></canvas><div><b>GOOOL!</b><span id="golquem"></span></div></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
